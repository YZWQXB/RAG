name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ENV: local
      SECRET_KEY: ci-only-secret
      DATABASE_URL: postgresql+asyncpg://rag_app:rag_app_pw@localhost:5432/rag
      MIGRATION_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/rag
      TEST_DATABASE_URL: postgresql+asyncpg://rag_app:rag_app_pw@localhost:5432/rag_test
      REDIS_URL: redis://localhost:6379/0
      # CI 一律用假 Provider：不联网、不需要模型权重，结果可复现
      EMBEDDING_PROVIDER: fake
      LLM_PROVIDER: fake
      RERANKER_PROVIDER: fake
      STORAGE_BACKEND: local
      STORAGE_LOCAL_DIR: .tmp-test-storage

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: 创建数据库与角色
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE ROLE rag_app LOGIN PASSWORD 'rag_app_pw';"
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE rag OWNER rag_app;"
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE rag_test OWNER rag_app;"
          PGPASSWORD=postgres psql -h localhost -U postgres -d rag_test -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: 安装依赖
        run: uv sync --frozen

      - name: 代码规范
        run: |
          uv run ruff check app/ worker/ scripts/ tests/
          uv run ruff format --check app/ worker/ scripts/

      - name: 测试
        run: uv run pytest -q --cov=app --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npx tsc -b --noEmit
      - run: npm run build

  eval:
    runs-on: ubuntu-latest
    needs: test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ENV: local
      SECRET_KEY: ci-only-secret
      DATABASE_URL: postgresql+asyncpg://rag_app:rag_app_pw@localhost:5432/rag
      MIGRATION_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/rag
      REDIS_URL: redis://localhost:6379/0
      EMBEDDING_PROVIDER: fake
      LLM_PROVIDER: fake
      RERANKER_PROVIDER: fake
      RETRIEVAL_NO_ANSWER_THRESHOLD_FAKE: "0.25"

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: 准备数据库
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE ROLE rag_app LOGIN PASSWORD 'rag_app_pw';"
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE rag OWNER rag_app;"
          PGPASSWORD=postgres psql -h localhost -U postgres -d rag -c "CREATE EXTENSION IF NOT EXISTS vector;"
          PGPASSWORD=postgres psql -h localhost -U postgres -d rag -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"

      - name: 安装依赖
        run: uv sync --frozen

      - name: 迁移
        run: uv run alembic upgrade head

      - name: 构建评测语料
        run: uv run python -m scripts.build_eval_corpus

      - name: 阈值回归检查
        run: uv run python -m scripts.calibrate_threshold --check
